@if (ariaLabel()) {
  <label class="sr-only" [for]="triggerId">{{ ariaLabel() }}</label>
}
<hlm-select
  [disabled]="disabled()"
  [itemToString]="itemLabel()"
  [value]="value()"
  (valueChange)="onValueChange($event)"
>
  <hlm-select-trigger
    class="h-9 w-full min-w-0"
    [buttonId]="triggerId"
    [aria-invalid]="invalid()"
    [forceInvalid]="invalid()"
    [describedBy]="describedBy()"
    (focusout)="blurred.emit()"
  >
    <hlm-select-value class="min-w-0 truncate" [placeholder]="displayPlaceholder()" />
  </hlm-select-trigger>
  <hlm-select-content *hlmSelectPortal>
    <hlm-select-group>
      @for (item of items(); track item.value) {
        <hlm-select-item [value]="item.value">{{ item.label }}</hlm-select-item>
      }
    </hlm-select-group>
  </hlm-select-content>
</hlm-select>
