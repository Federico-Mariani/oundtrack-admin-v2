<button
  hlmBtn
  [size]="size()"
  [variant]="variant()"
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="title()"
  [hlmDropdownMenuTrigger]="menu()"
  align="end"
>
  @if (loading()) {
    <hlm-spinner />
  } @else {
    <ng-icon [name]="icon()" aria-hidden="true" />
  }
</button>
