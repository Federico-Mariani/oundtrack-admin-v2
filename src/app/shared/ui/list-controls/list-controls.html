<div *transloco="let t; prefix: 'listControls'" class="flex min-w-0 items-center gap-3 sm:gap-5">
  <app-text-input
    class="min-w-0 max-w-64 flex-1"
    [formField]="search()"
    [label]="t('search')"
    [placeholder]="t('search')"
    type="search"
    inputMode="search"
    [hideLabel]="true"
  />
  <div class="hidden shrink-0 border-s ps-5 @[64rem]/table-controls:block">
    <app-list-filters [fields]="fields()" [compact]="true" />
  </div>
  <app-icon-button
    class="@[64rem]/table-controls:hidden"
    variant="outline"
    size="icon-sm"
    icon="lucideSlidersHorizontal"
    [ariaLabel]="t('open', { count: activeCount() })"
    [title]="t('title')"
    (click)="filtersOpen.set(true)"
  />
  <app-icon-button
    variant="ghost"
    size="icon-sm"
    class="hidden ms-auto @[64rem]/table-controls:block"
    icon="lucideFilterX"
    [ariaLabel]="t('reset')"
    [title]="t('reset')"
    (click)="resetFilters.emit()"
  />
  <app-dialog
    [(open)]="filtersOpen"
    [title]="t('title')"
    [description]="t('hint')"
    [content]="filters"
  />
  <ng-template #filters
    ><app-list-filters [fields]="fields()" /><app-button
      variant="outline"
      [text]="t('reset')"
      (click)="resetFilters.emit()"
  /></ng-template>
</div>
