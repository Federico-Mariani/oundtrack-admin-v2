<div *transloco="let t; prefix: 'listControls'" class="flex min-w-0 items-center gap-3 sm:gap-4">
  <app-text-input
    class="min-w-0 max-w-64 flex-1"
    [formField]="search()"
    [placeholder]="t('search')"
    type="search"
    inputMode="search"
  />
  <div class="hidden shrink-0 border-s ps-4 @[64rem]/table-controls:block">
    <app-list-filters [fields]="fields()" [compact]="true" />
  </div>
  <app-icon-button
    class="@[64rem]/table-controls:hidden"
    variant="outline"
    size="icon-sm"
    icon="lucideSlidersHorizontal"
    [ariaLabel]="t('open', { count: activeCount() })"
    [title]="t('title')"
    (click)="openFilters()"
  />
  <app-icon-button
    size="icon-sm"
    class="hidden @[64rem]/table-controls:block"
    icon="lucideFilterX"
    [ariaLabel]="t('reset')"
    [title]="t('reset')"
    (click)="resetFilters.emit()"
  />
</div>
