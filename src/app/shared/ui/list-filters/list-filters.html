<div
  [class.grid]="!compact()"
  [class.gap-4]="!compact()"
  [class.flex]="compact()"
  [class.items-start]="compact()"
  [class.gap-2]="compact()"
>
  @for (field of fields(); track field.key) {
    @if (field.kind === 'select') {
      <app-select-field
        [class.w-40]="compact()"
        [formField]="field.field"
        [label]="field.label"
        [items]="field.options ?? []"
      />
    } @else {
      <app-text-input
        [class.w-20]="compact()"
        [formField]="field.field"
        [label]="field.label"
        inputMode="numeric"
      />
    }
  }
</div>
