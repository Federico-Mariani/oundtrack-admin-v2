<div class="relative min-w-0" [class]="comfortable() ? 'space-y-2.5' : 'space-y-1'">
  <label
    class="block font-medium"
    [class]="comfortable() ? 'text-sm text-foreground' : 'text-xs text-muted-foreground'"
    [class.sr-only]="hideLabel()"
    [for]="id"
    >{{ label() }}</label
  >
  <input
    hlmInput
    class="min-w-0 w-full text-sm"
    [class]="comfortable() ? 'h-11' : 'h-9'"
    [id]="id"
    [formField]="formField()"
    [type]="type()"
    [attr.inputmode]="inputMode()"
    [placeholder]="placeholder()"
    [attr.aria-invalid]="errors().length > 0"
    [attr.aria-describedby]="
      (hint() ? id + '-hint ' : '') + (errors().length ? id + '-errors' : '')
    "
  />
  @if (hint()) {
    <p [id]="id + '-hint'" class="text-sm leading-relaxed text-muted-foreground">{{ hint() }}</p>
  }
  @if (errors().length) {
    <app-field-error [id]="id + '-errors'" [errors]="errors()" />
  }
</div>
