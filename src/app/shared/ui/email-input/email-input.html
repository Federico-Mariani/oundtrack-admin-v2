<hlm-field>
  <label hlmFieldLabel for="email">Email</label>
  <hlm-input-group>
    <input
      hlmInputGroupInput
      [formField]="formField()"
      [placeholder]="placeholder()"
      [type]="'email'"
      (blur)="touch.emit()"
    />
  </hlm-input-group>
  @if (visibleErrors().length > 0) {
    <app-field-error [errors]="visibleErrors()" />
  }
</hlm-field>
