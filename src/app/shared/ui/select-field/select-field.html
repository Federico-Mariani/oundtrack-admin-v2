<div class="min-w-0 space-y-1">
  <span class="block text-xs font-medium text-muted-foreground" [class.sr-only]="hideLabel()">{{
    label()
  }}</span
  ><app-select
    [items]="items()"
    [disabled]="disabled() || formField()().disabled()"
    [invalid]="errors().length > 0"
    [describedBy]="errors().length ? errorId : undefined"
    (blurred)="formField()().markAsTouched()"
    [value]="formField()().value()"
    [ariaLabel]="label()"
    (valueChange)="change($event)"
  />
  @if (errors().length) {
    <app-field-error [id]="errorId" [errors]="errors()" />
  }
</div>
