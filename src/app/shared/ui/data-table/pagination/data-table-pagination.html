<fieldset
  [disabled]="disabled()"
  *transloco="let t; prefix: 'dataTable'"
  class="@container/pagination min-w-0 flex flex-wrap items-center justify-between gap-3 px-1 text-sm"
>
  <p class="text-muted-foreground" role="status">
    {{ t('range', { start: start(), end: end(), total: total() }) }}
  </p>
  <div class="flex flex-wrap items-center gap-3 sm:gap-5">
    <div class="flex items-center gap-2 text-muted-foreground">
      <span class="hidden @sm/pagination:inline">{{ t('rowsPerPage') }}</span>
      <app-select
        [items]="pageSizeItems"
        [value]="pageSizeValue()"
        [ariaLabel]="t('rowsPerPage')"
        (valueChange)="setPageSize($event)"
      />
    </div>
    <span class="hidden @sm/pagination:inline">{{
      t('page', { current: page(), total: pageCount() })
    }}</span>
    <span class="@sm/pagination:hidden">{{
      t('pageCompact', { current: page(), total: pageCount() })
    }}</span>
    <div class="flex gap-1">
      <app-icon-button
        variant="outline"
        size="icon-sm"
        class="hidden @sm/pagination:block"
        icon="lucideChevronsLeft"
        [ariaLabel]="t('firstPage')"
        [disabled]="!canPrevious()"
        (click)="canPrevious() && table().firstPage()"
      />
      <app-icon-button
        variant="outline"
        size="icon-sm"
        icon="lucideChevronLeft"
        [ariaLabel]="t('previousPage')"
        [disabled]="!canPrevious()"
        (click)="canPrevious() && table().previousPage()"
      />
      <app-icon-button
        variant="outline"
        size="icon-sm"
        icon="lucideChevronRight"
        [ariaLabel]="t('nextPage')"
        [disabled]="!canNext()"
        (click)="canNext() && table().nextPage()"
      />
      <app-icon-button
        variant="outline"
        size="icon-sm"
        class="hidden @sm/pagination:block"
        icon="lucideChevronsRight"
        [ariaLabel]="t('lastPage')"
        [disabled]="!canNext()"
        (click)="canNext() && table().lastPage()"
      />
    </div>
  </div>
</fieldset>
