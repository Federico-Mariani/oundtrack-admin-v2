<fieldset
  [disabled]="disabled()"
  *transloco="let t; prefix: 'dataTable'"
  class="flex flex-wrap items-center justify-between gap-2 px-1 text-sm"
>
  <div class="flex flex-wrap items-center gap-2">
    <div class="flex items-center gap-2 text-muted-foreground">
      <app-select
        [items]="pageSizeItems"
        [value]="pageSizeValue()"
        [ariaLabel]="t('rowsPerPage')"
        (valueChange)="setPageSize($event)"
      />
    </div>
    <span>{{ t('pageCompact', { current: page(), total: table().getPageCount() }) }}</span>
    <div class="flex gap-1">
      <app-icon-button
        variant="outline"
        size="icon-sm"
        icon="lucideChevronsLeft"
        [ariaLabel]="t('firstPage')"
        [disabled]="!table().getCanPreviousPage()"
        (click)="table().firstPage()"
      />
      <app-icon-button
        variant="outline"
        size="icon-sm"
        icon="lucideChevronLeft"
        [ariaLabel]="t('previousPage')"
        [disabled]="!table().getCanPreviousPage()"
        (click)="table().previousPage()"
      />
      <app-icon-button
        variant="outline"
        size="icon-sm"
        icon="lucideChevronRight"
        [ariaLabel]="t('nextPage')"
        [disabled]="!table().getCanNextPage()"
        (click)="table().nextPage()"
      />
      <app-icon-button
        variant="outline"
        size="icon-sm"
        icon="lucideChevronsRight"
        [ariaLabel]="t('lastPage')"
        [disabled]="!table().getCanLastPage()"
        (click)="table().lastPage()"
      />
    </div>
  </div>
</fieldset>
