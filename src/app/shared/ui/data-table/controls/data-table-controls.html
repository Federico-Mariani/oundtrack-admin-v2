<div *transloco="let t; prefix: 'dataTable'" class="flex min-w-0 items-center gap-4 sm:gap-6">
  <ng-container [ngTemplateOutlet]="controls()" />
  <div class="flex shrink-0 items-center border-s ps-4" role="group" [attr.aria-label]="t('view')">
    <app-data-table-toolbar
      [table]="table()"
      [loading]="loading()"
      (refresh)="refresh.emit()"
      [(density)]="density"
    />
  </div>
</div>
