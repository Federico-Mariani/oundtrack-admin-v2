<div
  *transloco="let t; prefix: 'dataTable'"
  class="flex min-w-0 items-end gap-2 rounded-xl border bg-card p-2"
>
  <div class="min-w-0 flex-1"><ng-container [ngTemplateOutlet]="controls()" /></div>
  <div class="flex shrink-0 items-center border-s ps-2" role="group" [attr.aria-label]="t('view')">
    <app-data-table-toolbar
      [table]="table()"
      [loading]="loading()"
      (refresh)="refresh.emit()"
      [(density)]="density"
    />
  </div>
  <div class="hidden shrink-0 border-s ps-2 @[64rem]/table-controls:block">
    <app-data-table-pagination [table]="table()" [disabled]="loading()" />
  </div>
  <app-icon-button
    class="@[64rem]/table-controls:hidden"
    variant="outline"
    size="icon-sm"
    icon="lucideListOrdered"
    [ariaLabel]="t('pagination')"
    [title]="t('pagination')"
    (click)="paginationOpen.set(true)"
  />
  <app-dialog
    [(open)]="paginationOpen"
    [title]="t('pagination')"
    [description]="t('paginationHint')"
    [content]="pages"
  />
  <ng-template #pages
    ><app-data-table-pagination [table]="table()" [disabled]="loading()"
  /></ng-template>
</div>
