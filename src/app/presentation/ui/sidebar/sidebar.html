<div hlmSidebarWrapper class="h-dvh min-h-0 overflow-hidden">
  <hlm-sidebar collapsible="icon" *transloco="let t">
    <div hlmSidebarHeader>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <div class="flex items-center gap-2 overflow-hidden rounded-md p-2">
            <img class="w-8 h-8" src="assets/images/logo.png" alt="Oundtrack logo" />
            <div class="grid flex-1 text-start text-sm leading-tight">
              <span class="truncate font-medium">{{ t('sidebar.menu.title') }}</span>
              <span class="truncate text-xs">{{ t('sidebar.menu.subTitle') }}</span>
            </div>
          </div>
        </li>
      </ul>
    </div>
    <div hlmSidebarContent>
      <app-sidebar-navigation [groups]="groups()" />
    </div>
    <div hlmSidebarFooter>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <button
            hlmSidebarMenuButton
            size="lg"
            align="end"
            side="right"
            [hlmDropdownMenuTrigger]="menu"
            [disabled]="loggingOut()"
            [attr.aria-busy]="loggingOut()"
          >
            @if (user()?.avatar) {
              <app-avatar [alt]="'avatar'" [source]="user()!.avatar!" />
            }
            <div class="grid flex-1 text-start text-sm leading-tight">
              <span class="truncate font-medium"
                >{{ user()?.firstName }} {{ user()?.lastName }}</span
              >
              <span class="truncate text-xs">{{ user()?.email }}</span>
            </div>
            @if (loggingOut()) {
              <hlm-spinner />
            } @else {
              <ng-icon name="lucideChevronsUpDown" />
            }
          </button>
          <ng-template #menu>
            <hlm-dropdown-menu>
              <hlm-dropdown-menu-group>
                <button class="p-3 pe-10 pointer-events-none" hlmDropdownMenuItem size="lg">
                  @if (user()?.avatar) {
                    <app-avatar [alt]="'avatar'" [source]="user()!.avatar!" />
                  }
                  <div class="grid flex-1 text-start text-sm leading-tight">
                    <span class="truncate font-medium"
                      >{{ user()?.firstName }} {{ user()?.lastName }}</span
                    >
                    <span class="truncate text-xs">{{ user()?.email }}</span>
                  </div>
                </button>
              </hlm-dropdown-menu-group>
              <hlm-dropdown-menu-separator />
              <hlm-dropdown-menu-group>
                <button
                  (triggered)="logout.emit()"
                  [disabled]="loggingOut()"
                  hlmDropdownMenuItem
                  variant="destructive"
                >
                  <ng-icon name="lucideLogOut" />
                  {{ t('sidebar.menu.logout') }}
                </button>
              </hlm-dropdown-menu-group>
            </hlm-dropdown-menu>
          </ng-template>
        </li>
      </ul>
    </div>
  </hlm-sidebar>
  <ng-content />
</div>
