<hlm-field>
    <label hlmFieldLabel for="email">Email</label>
    <hlm-input-group>
        <input
                hlmInputGroupInput
                [formField]="formField()"
                [placeholder]="placeholder()"
                [type]="'email'"
                (blur)="touch.emit()"
        />
    </hlm-input-group>
    @for (error of errorsData(); track $index) {
        <hlm-field-error [validator]="error.kind">
            {{ error.message }}
        </hlm-field-error>
    }
</hlm-field>
