<hlm-card *transloco="let translator; prefix: i18nScope">
  <hlm-card-header>
    <h3 hlmCardTitle>{{ translator('components.loginForm.title') }}</h3>
    <p hlmCardDescription>{{ translator('components.loginForm.description') }}</p>
  </hlm-card-header>
  <div hlmCardContent>
    <form [formRoot]="loginFormController.form" id="login-form">
      <hlm-field-group>
        <app-email-input [formField]="loginFormController.form.email" />
        <app-password-input [formField]="loginFormController.form.password" />
      </hlm-field-group>
    </form>
  </div>
  <hlm-card-footer>
    <hlm-field>
      <app-button
        [loading]="isLoggingIn() || isLoadingCurrentUser()"
        [text]="translator('components.loginForm.actions.submit')"
        [disabled]="!canSubmit()"
        type="submit"
        form="login-form"
      />
      <app-button
        (click)="reset()"
        [text]="translator('components.loginForm.actions.reset')"
        [disabled]="!canSubmit()"
        variant="outline"
      />
    </hlm-field>
  </hlm-card-footer>
</hlm-card>
