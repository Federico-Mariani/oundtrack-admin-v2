<div *transloco="let t; prefix: 'avatars.catalog'" class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center justify-between gap-4">
    <div class="space-y-1">
      <div class="flex items-center gap-3">
        <span
          class="flex size-8 items-center justify-center rounded-md border bg-card text-primary shadow-sm"
          ><ng-icon name="lucideUserRound" aria-hidden="true"
        /></span>
        <h1 class="text-2xl font-semibold tracking-tight">{{ t('title') }}</h1>
      </div>
      <p class="mt-1 text-sm text-muted-foreground">{{ t('description') }}</p>
    </div>
    <app-button icon="lucidePlus" [text]="t('create')" (click)="manage()" />
  </header>
  <app-avatars-table
    [avatars]="avatars()"
    [loading]="loading()"
    [errorMessage]="error() ? t('loadFailed') : null"
    (retry)="reload()"
    (edit)="edit($event)"
    (copyId)="copy($event)"
  />
</div>
