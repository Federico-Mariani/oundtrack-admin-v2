<div class="flex justify-end">
  <app-icon-button variant="ghost" size="icon-sm" icon="lucideEllipsis" [menu]="actionsMenu" />
</div>
<ng-template #actionsMenu>
  <div hlmDropdownMenu class="w-56">
    <button hlmDropdownMenuItem type="button" (triggered)="edit.emit()">
      <ng-icon name="lucidePencil" aria-hidden="true" />{{ editLabel() }}
    </button>
    <button hlmDropdownMenuItem type="button" (triggered)="copyId.emit()">
      <ng-icon name="lucideCopy" aria-hidden="true" />{{ copyLabel() }}
    </button>
  </div>
</ng-template>
