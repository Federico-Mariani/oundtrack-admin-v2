<article
  *transloco="let t; prefix: 'hints.editor'"
  class="overflow-hidden rounded-lg border border-border bg-card text-card-foreground"
>
  <header class="flex items-center gap-3 p-5">
    <span
      class="flex size-10 shrink-0 items-center justify-center rounded-md bg-muted text-muted-foreground"
      ><ng-icon [name]="icon()" class="text-xl" aria-hidden="true"
    /></span>
    <div class="min-w-0 flex-1">
      <h4 class="text-sm font-semibold">{{ t('types.' + hint().type) }}</h4>
      <p class="mt-0.5 text-xs text-muted-foreground">
        {{ t(info()?.image ? 'visualHint' : 'textHint') }}
      </p>
    </div>
    <app-icon-button
      class="me-2"
      variant="outline"
      size="icon-sm"
      icon="lucideEllipsis"
      [ariaLabel]="t('actions') + ': ' + t('types.' + hint().type)"
      [disabled]="disabled()"
      [menu]="actions"
    />
  </header>
  <div class="space-y-4 px-5 pb-5 sm:px-6 sm:pb-6">
    @if (info(); as info) {
      @if (info.image) {
        <app-media-image
          class="block aspect-video w-full rounded-md"
          [src]="info.image"
          [contain]="true"
          [alt]="t('types.' + hint().type)"
          [fallback]="t('imageUnavailable')"
        />
      }
      @if (info.text) {
        <p class="whitespace-pre-wrap wrap-break-word text-sm leading-7">{{ info.text }}</p>
      }
    } @else {
      <p class="py-3 text-sm leading-relaxed text-muted-foreground">{{ t('missing') }}</p>
    }
    <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
      <app-language-tags [languages]="languages()" />
      <span
        class="flex shrink-0 items-center gap-1.5 text-sm font-semibold tabular-nums"
        [attr.aria-label]="t('cost') + ': ' + hint().cost"
        ><ng-icon name="lucideCoins" class="text-base text-muted-foreground" aria-hidden="true" />
        {{ hint().cost }}</span
      >
    </div>
  </div>
  <ng-template #actions>
    <app-action-menu
      [items]="[
        { value: modes.Edit, label: t('modes.edit'), disabled: disabled() },
        {
          value: modes.Translate,
          label: t('modes.translate'),
          disabled: disabled() || !canTranslate(),
        },
        { value: modes.Delete, label: t('modes.delete'), disabled: disabled(), destructive: true },
      ]"
      (selected)="selectAction($event)"
    />
  </ng-template>
</article>
