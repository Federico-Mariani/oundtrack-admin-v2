<app-modal-frame
  *transloco="let t; prefix: 'hints.editor'"
  [title]="t('modes.' + params.mode)"
  [description]="params.mode === modes.Delete ? t('deleteDescription') : t('imageNote')"
  [closeDisabled]="busy()"
>
  <form class="mt-7 space-y-6" (submit)="submit($event)">
    @if (params.mode !== modes.Delete) {
      @if (params.mode === modes.Create) {
        <div class="space-y-2.5">
          <p class="text-sm font-medium">{{ t('type') }}</p>
          <app-select
            [items]="typeItems()"
            [value]="type()"
            [ariaLabel]="t('type')"
            [disabled]="busy()"
            (valueChange)="changeType($event)"
          />
        </div>
      }
      @if (type(); as type) {
        <div class="flex items-center gap-4 rounded-lg bg-muted/50 p-4">
          <img class="size-14 shrink-0" [src]="'/assets/hints/' + type + '.svg'" alt="" /><span
            class="font-medium"
            >{{ t('types.' + type) }}</span
          >
        </div>
      }
      <div class="grid gap-6 sm:grid-cols-2">
        <div class="space-y-2.5">
          <p class="text-sm font-medium">{{ t('language') }}</p>
          <app-select
            [items]="languageItems()"
            [value]="locale()"
            [ariaLabel]="t('language')"
            [disabled]="busy() || params.mode === modes.Edit"
            (valueChange)="changeLanguage($event)"
          />
        </div>
        @if (params.mode !== modes.Translate) {
          <app-text-input
            [formField]="fields.cost"
            [label]="t('cost')"
            inputMode="numeric"
            [comfortable]="true"
            [messages]="costErrors()"
          />
        }
      </div>
      <app-textarea [formField]="fields.text" [label]="t('text')" [messages]="textErrors()" />
    }
    @if (error()) {
      <p role="alert" class="text-sm leading-relaxed text-destructive">{{ errorMessage() }}</p>
    }
    <div class="grid gap-3 pt-2">
      <app-button
        type="submit"
        [text]="params.mode === modes.Delete ? t('modes.delete') : t('save')"
        [variant]="params.mode === modes.Delete ? 'destructive' : 'default'"
        [loading]="busy()"
        [disabled]="busy()"
        buttonClass="h-11 w-full"
      /><app-button
        [text]="t('cancel')"
        variant="outline"
        [disabled]="busy()"
        buttonClass="h-11 w-full"
        (click)="ref.close(false)"
      />
    </div></form
></app-modal-frame>
